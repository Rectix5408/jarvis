<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JARVIS | Workflows</title><link rel="stylesheet" href="/static/css/theme.css?v=11"><link rel="stylesheet" href="/static/css/shell.css?v=1"><link rel="stylesheet" href="/static/css/workflows.css?v=1"><script src="/static/vendor/lucide/lucide.min.js" defer></script><script src="/static/js/shell.js?v=1" defer></script><script src="/static/js/workflows.js?v=1" defer></script></head>
<body><main class="workflow-workspace"><header><div><span>JARVIS / AUTOMATION</span><h1>Workflow Builder</h1></div><div><button id="new-workflow"><i data-lucide="file-plus"></i>Neu</button><button id="save-workflow" class="primary"><i data-lucide="save"></i>Speichern</button></div></header><p id="workflow-status" role="status">Workflows werden geladen.</p>
<div class="builder"><aside><h2>Workflows</h2><div id="workflow-list"></div></aside><section class="canvas"><div class="workflow-fields"><label>Name<input id="workflow-name" maxlength="80"></label><label>Beschreibung<input id="workflow-description" maxlength="1000"></label></div><div id="node-list" class="node-list"></div><div class="node-add"><select id="node-type"></select><button id="add-node" title="Node hinzufuegen" aria-label="Node hinzufuegen"><i data-lucide="plus"></i></button></div></section><aside class="runtime"><h2>Ausfuehrung</h2><label>Eingabe<textarea id="workflow-input"></textarea></label><button id="run-workflow" class="primary"><i data-lucide="play"></i>Starten</button><h3>Letzte Laeufe</h3><div id="workflow-runs"></div></aside></div></main></body></html>
